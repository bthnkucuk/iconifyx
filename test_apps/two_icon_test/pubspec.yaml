name: two_icon_test
description: Verify bundle size when an app depends on only two per-set packages.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../../packages/iconifyx_core
  iconifyx_lucide:
    path: ../../packages/iconifyx_lucide
  iconifyx_ic:
    path: ../../packages/iconifyx_ic
  iconifyx_ph:
    path: ../../packages/iconifyx_ph

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
