# flutter_all_icons generator configuration
#
# After the per-set-package refactor, this file only:
#   1. Excludes specific sets from generation
#   2. Optionally renames Iconify categories for display in the example app
#
# Set→package routing is now mechanical: every set becomes its own
# `flutter_all_icons_<prefix>` package. No grouping rules needed.

excludedSets:
  # Custom Brand Icons is CC-BY-NC-SA (NonCommercial only). Distributing in a
  # generic Flutter package could conflict with commercial usage; exclude.
  - custom-brand-icons

# Stroke-only icon sets need an outline-the-stroke pre-pass before being
# converted to a font, otherwise paths render as solid filled shapes (e.g.
# a circle outline becomes a filled disc). Listed sets get sent through
# oslllo-svg-fixer (rasterize + Potrace trace) which is slow but produces
# correct filled outlines.
#
# Output is cached on disk at tools/generator/.cache/strokefill/<prefix>/ so
# only first-time generation pays the cost; subsequent runs reuse the cache.
strokeFillSets:
  - lucide
  - lucide-lab
  - tabler
  - iconoir
  - mdi-light
  - ph-thin
  - ph-light
  - phosphor-thin
  - phosphor-light
  - feather
  - hugeicons
  - solar
  - jam
  - akar-icons
  - radix-icons
  - heroicons-outline
  - octicon
  - mage
  - hugeicons
  - lineicons
  - iconamoon
  - prime
  - basil
  - guidance
  - humbleicons
  - meteor-icons
  - sidekickicons
  - tdesign
  - circum
  - mynaui
  - et

# Synthesize multi-weight variants for stroke-only sets that don't already
# ship weight families upstream. For each listed prefix, the generator
# clones every icon body N times, swapping `stroke-width="2"` for the
# configured value, and gives the variant a name suffix (e.g.
# `activity` → `activity-thin`, `activity-light`, `activity-bold`). The
# variants flow through stroke-fill, codepoint allocation, and Dart codegen
# like ordinary icons and ship as additional static const fields
# (`LucideIcons.activityThin`, `LucideIcons.activityBold`, …). The default
# (no suffix) keeps the regular weight.
#
# Sets that already ship native weight variants in Iconify (`ph`, `fa6-*`,
# `heroicons*`, …) do NOT need to be here — those weight families are
# already separate icon names in the source JSON.
multiWeightStrokeSets:
  lucide:
    thin: 1.0
    light: 1.5
    bold: 2.5
  lucide-lab:
    thin: 1.0
    light: 1.5
    bold: 2.5
  tabler:
    thin: 1.0
    light: 1.5
    bold: 2.5
  iconoir:
    thin: 1.0
    light: 1.5
    bold: 2.5
  feather:
    thin: 1.0
    light: 1.5
    bold: 2.5

# Source-pack base stroke widths, consumed by the multi-weight synthesizer
# in pipeline.ts. The synthesizer now scales every existing `stroke-width`
# in the source body by `ratio = newWidth / base` (§6 fix) so per-layer
# ratios survive variant generation. Prefixes absent from this map default
# to base=2 (Lucide / Tabler / Phosphor-regular / Feather / Heroicons).
# Iconoir is the only listed pack with a non-2 base.
multiWeightStrokeSourceBase:
  iconoir: 1.5

# Iconify packs that encode meaning through concrete colours rather than
# relying on the consumer's `currentColor`. Before stroke-fill, the
# pipeline normalises every concrete `fill=…` / `stroke=…` to
# `currentColor` so rasterize+Potrace sees a high-contrast silhouette.
# Two-tone bodies additionally split into duotone primary/secondary;
# three-or-more-tone bodies flatten to a single layer. Catppuccin is
# the canonical case — without this pass its 659 icons shipped as
# empty glyphs because Potrace traced its light-on-light palette as
# blank.
colorMappedSets:
  - catppuccin

# Iconify packs whose paint-order-dropped icons (multi-fill bodies that
# would render as featureless monochrome blobs in a flat TTF) should be
# recovered via the vtracer pipeline. For each listed prefix the
# generator rasterises every paint-order-drop candidate, runs
# `@neplex/vectorizer` in stacked-colour mode, reduces the resulting
# layered SVG to a top-2 (background + foreground) duotone, and emits
# the icon as `IconifyIconData.duo(p, s, kind: kindPaintOrder)` — the
# same path the two-colour `trySplitTwoColorBody` produces for logos.
#
# Opt-in because vtracer first-run is slow (~80-200 ms / icon); output
# is cached at `tools/generator/.cache/vtrace/<prefix>/<sha>.json` so
# warm regens read from disk in microseconds.
#
# Target packs (estimated recovery vs current drops):
#   - twemoji            (~4500 drops → ~3000 recoverable estimate)
#   - noto               (~3800 → ~2500; gradient bodies stay dropped)
#   - fluent-emoji-flat  (~3174 → ~2000)
#   - circle-flags       (~737 → ~600 silhouettes)
#
# Bodies that vtracer can't reduce to ≥2 distinct layers, or whose
# trace worker panics, still fall through to the existing paint-order
# drop path. See tools/generator/src/vtracer.ts + vtracer_worker.ts.
# Phase 1 opt-in list. `circle-flags` and `twemoji` are proven at
# 100 % recovery on first-cache-cold run (732 / 732 and 3 861 / 3 861
# respectively, see docs/RESEARCH_PLAN.md §1 empirical-results table).
# `fluent-emoji-flat` and `noto` are eligible (~3 088 / ~4 020
# candidates each) but pending visual review of a recovered sample
# — uncomment them when ready to regenerate.
vtracerSets:
  - circle-flags
  - twemoji
  - fluent-emoji-flat
#   - noto

# Pretty names for Iconify category strings (example app drawer headers).
displayCategoryAliases:
  "UI 24px": "UI · 24px Grid"
  "UI Other / Mixed Grid": "UI · Mixed Grid"
  "UI 16px / 32px": "UI · 16px / 32px"
  "UI Multicolor": "UI · Multicolor"
  "Brands / Social": "Brands & Social"
  "Flags / Maps": "Flags & Maps"
  "Archive / Unmaintained": "Archive"
