<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!--
    COOP/COEP requirement for `performance.measureUserAgentSpecificMemory()`.

    The website's runtime memory probe (lib/bootstrap/memory_probe.dart) uses
    the accurate `measureUserAgentSpecificMemory()` browser API when it's
    available. That API is gated by Chrome behind cross-origin isolation,
    which requires the SERVER to emit these response headers on every
    document and bootstrap script:

        Cross-Origin-Opener-Policy: same-origin
        Cross-Origin-Embedder-Policy: require-corp

    HTML <meta http-equiv> can carry these on platforms that respect it,
    but GitHub Pages does NOT — it strips response headers and serves
    static files with its own fixed set. So on the current pages.github.io
    deployment the probe automatically falls back to the Chromium-only
    `performance.memory.usedJSHeapSize` (an underestimate) and ultimately
    to a visit-count heuristic. See `docs/DEPLOYMENT.md` §"COOP/COEP for
    memory probe" for the follow-up plan to either (a) move to a CDN
    that lets us set headers, or (b) inject them via a service worker.

    Leaving the meta tags below in HTML is harmless on environments that
    don't act on them and lights up the accurate path the moment we
    deploy somewhere that does respect document-level COOP/COEP.
  -->
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="iconifyx_website">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>iconifyx_website</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
