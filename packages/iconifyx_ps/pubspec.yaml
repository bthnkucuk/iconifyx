name: iconifyx_ps
description: >-
  PrestaShop Icons icons from Iconify, packaged for Flutter (479 icons, CC BY-NC 4.0 license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: Ps
      fonts:
        - asset: assets/fonts/Ps.ttf
