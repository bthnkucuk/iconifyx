name: iconifyx_grommet_icons
description: >-
  Grommet Icons icons from Iconify, packaged for Flutter (637 icons, Apache 2.0 license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: GrommetIcons
      fonts:
        - asset: assets/fonts/GrommetIcons.ttf
    - family: GrommetIconsSecondary
      fonts:
        - asset: assets/fonts/GrommetIconsSecondary.ttf
