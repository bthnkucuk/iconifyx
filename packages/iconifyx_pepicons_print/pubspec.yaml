name: iconifyx_pepicons_print
description: >-
  Pepicons Print icons from Iconify, packaged for Flutter (128 icons, CC BY 4.0 license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: PepiconsPrint
      fonts:
        - asset: assets/fonts/PepiconsPrint.ttf
