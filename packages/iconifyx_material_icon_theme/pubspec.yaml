name: iconifyx_material_icon_theme
description: >-
  Material Icon Theme icons from Iconify, packaged for Flutter (774 icons, MIT license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: MaterialIconTheme
      fonts:
        - asset: assets/fonts/MaterialIconTheme.ttf
    - family: MaterialIconThemeSecondary
      fonts:
        - asset: assets/fonts/MaterialIconThemeSecondary.ttf
