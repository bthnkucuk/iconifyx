name: iconifyx_bx
description: >-
  BoxIcons v2 icons from Iconify, packaged for Flutter (921 icons, MIT license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: Bx
      fonts:
        - asset: assets/fonts/Bx.ttf
