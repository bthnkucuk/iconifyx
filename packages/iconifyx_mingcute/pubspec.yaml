name: iconifyx_mingcute
description: >-
  MingCute Icon icons from Iconify, packaged for Flutter (11 icons, Apache 2.0 license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: Mingcute
      fonts:
        - asset: assets/fonts/Mingcute.ttf
