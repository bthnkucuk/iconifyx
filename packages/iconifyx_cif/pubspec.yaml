name: iconifyx_cif
description: >-
  CoreUI Flags icons from Iconify, packaged for Flutter (160 icons, CC0 1.0 license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: Cif
      fonts:
        - asset: assets/fonts/Cif.ttf
    - family: CifSecondary
      fonts:
        - asset: assets/fonts/CifSecondary.ttf
