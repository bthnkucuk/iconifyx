name: iconifyx_logos_meta
description: >-
  iconifyx category-meta package: re-exports every "Logos" Iconify pack (15 members). Convenient bundle for apps that want all icons in this category at the cost of shipping every member font.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core
  iconifyx_arcticons:
    path: ../iconifyx_arcticons
  iconifyx_brandico:
    path: ../iconifyx_brandico
  iconifyx_bxl:
    path: ../iconifyx_bxl
  iconifyx_cbi:
    path: ../iconifyx_cbi
  iconifyx_cib:
    path: ../iconifyx_cib
  iconifyx_cryptocurrency:
    path: ../iconifyx_cryptocurrency
  iconifyx_cryptocurrency_color:
    path: ../iconifyx_cryptocurrency_color
  iconifyx_entypo_social:
    path: ../iconifyx_entypo_social
  iconifyx_fa7_brands:
    path: ../iconifyx_fa7_brands
  iconifyx_logos:
    path: ../iconifyx_logos
  iconifyx_nonicons:
    path: ../iconifyx_nonicons
  iconifyx_simple_icons:
    path: ../iconifyx_simple_icons
  iconifyx_streamline_logos:
    path: ../iconifyx_streamline_logos
  iconifyx_token:
    path: ../iconifyx_token
  iconifyx_token_branded:
    path: ../iconifyx_token_branded
