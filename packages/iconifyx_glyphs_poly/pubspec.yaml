name: iconifyx_glyphs_poly
description: >-
  Glyphs Poly icons from Iconify, packaged for Flutter (371 icons, MIT license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: GlyphsPoly
      fonts:
        - asset: assets/fonts/GlyphsPoly.ttf
    - family: GlyphsPolySecondary
      fonts:
        - asset: assets/fonts/GlyphsPolySecondary.ttf
