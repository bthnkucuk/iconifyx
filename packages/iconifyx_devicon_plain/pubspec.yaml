name: iconifyx_devicon_plain
description: >-
  Devicon Plain icons from Iconify, packaged for Flutter (218 icons, MIT license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: DeviconPlain
      fonts:
        - asset: assets/fonts/DeviconPlain.ttf
    - family: DeviconPlainSecondary
      fonts:
        - asset: assets/fonts/DeviconPlainSecondary.ttf
