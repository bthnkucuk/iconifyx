name: iconifyx_noto_v1
description: >-
  Noto Emoji (v1) icons from Iconify, packaged for Flutter (647 icons, Apache 2.0 license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: NotoV1
      fonts:
        - asset: assets/fonts/NotoV1.ttf
    - family: NotoV1Secondary
      fonts:
        - asset: assets/fonts/NotoV1Secondary.ttf
