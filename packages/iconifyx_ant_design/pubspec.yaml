name: iconifyx_ant_design
description: >-
  Ant Design Icons icons from Iconify, packaged for Flutter (1870 icons, MIT license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: AntDesign
      fonts:
        - asset: assets/fonts/AntDesign.ttf
    - family: AntDesignSecondary
      fonts:
        - asset: assets/fonts/AntDesignSecondary.ttf
