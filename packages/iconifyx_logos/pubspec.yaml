name: iconifyx_logos
description: >-
  SVG Logos icons from Iconify, packaged for Flutter (902 icons, CC0 license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: Logos
      fonts:
        - asset: assets/fonts/Logos.ttf
    - family: LogosSecondary
      fonts:
        - asset: assets/fonts/LogosSecondary.ttf
