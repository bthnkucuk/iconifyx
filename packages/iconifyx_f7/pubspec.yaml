name: iconifyx_f7
description: >-
  Framework7 Icons icons from Iconify, packaged for Flutter (1253 icons, MIT license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: F7
      fonts:
        - asset: assets/fonts/F7.ttf
