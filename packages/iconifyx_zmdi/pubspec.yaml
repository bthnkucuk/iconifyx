name: iconifyx_zmdi
description: >-
  Material Design Iconic Font icons from Iconify, packaged for Flutter (885 icons, Open Font License license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: Zmdi
      fonts:
        - asset: assets/fonts/Zmdi.ttf
