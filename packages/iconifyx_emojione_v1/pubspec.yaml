name: iconifyx_emojione_v1
description: >-
  Emoji One (v1) icons from Iconify, packaged for Flutter (365 icons, CC BY-SA 4.0 license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: EmojioneV1
      fonts:
        - asset: assets/fonts/EmojioneV1.ttf
    - family: EmojioneV1Secondary
      fonts:
        - asset: assets/fonts/EmojioneV1Secondary.ttf
