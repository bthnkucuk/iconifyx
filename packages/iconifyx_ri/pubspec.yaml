name: iconifyx_ri
description: >-
  Remix Icon icons from Iconify, packaged for Flutter (3244 icons, Apache 2.0 license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: Ri
      fonts:
        - asset: assets/fonts/Ri.ttf
