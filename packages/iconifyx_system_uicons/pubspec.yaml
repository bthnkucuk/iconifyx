name: iconifyx_system_uicons
description: >-
  System UIcons icons from Iconify, packaged for Flutter (332 icons, Unlicense license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: SystemUicons
      fonts:
        - asset: assets/fonts/SystemUicons.ttf
