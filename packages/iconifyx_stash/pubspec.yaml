name: iconifyx_stash
description: >-
  Stash Icons icons from Iconify, packaged for Flutter (173 icons, MIT license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: Stash
      fonts:
        - asset: assets/fonts/Stash.ttf
    - family: StashSecondary
      fonts:
        - asset: assets/fonts/StashSecondary.ttf
