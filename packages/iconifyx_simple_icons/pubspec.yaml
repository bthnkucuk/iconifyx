name: iconifyx_simple_icons
description: >-
  Simple Icons icons from Iconify, packaged for Flutter (3576 icons, CC0 1.0 license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: SimpleIcons
      fonts:
        - asset: assets/fonts/SimpleIcons.ttf
