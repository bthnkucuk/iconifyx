name: iconifyx_ui_mixed_meta
description: >-
  iconifyx category-meta package: re-exports every "UI Other / Mixed Grid" Iconify pack (36 members). Convenient bundle for apps that want all icons in this category at the cost of shipping every member font.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
