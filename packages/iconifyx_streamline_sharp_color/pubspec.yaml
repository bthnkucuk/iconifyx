name: iconifyx_streamline_sharp_color
description: >-
  Sharp color icons icons from Iconify, packaged for Flutter (62 icons, CC BY 4.0 license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: StreamlineSharpColor
      fonts:
        - asset: assets/fonts/StreamlineSharpColor.ttf
