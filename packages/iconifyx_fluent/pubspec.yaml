name: iconifyx_fluent
description: >-
  Fluent UI System Icons icons from Iconify, packaged for Flutter (20197 icons, MIT license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: Fluent
      fonts:
        - asset: assets/fonts/Fluent.ttf
    - family: Fluent_2
      fonts:
        - asset: assets/fonts/Fluent_2.ttf
    - family: Fluent_3
      fonts:
        - asset: assets/fonts/Fluent_3.ttf
    - family: Fluent_4
      fonts:
        - asset: assets/fonts/Fluent_4.ttf
