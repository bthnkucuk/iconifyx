name: iconifyx_flat_color_icons
description: >-
  Flat Color Icons icons from Iconify, packaged for Flutter (329 icons, MIT license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: FlatColorIcons
      fonts:
        - asset: assets/fonts/FlatColorIcons.ttf
