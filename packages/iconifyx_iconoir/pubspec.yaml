name: iconifyx_iconoir
description: >-
  Iconoir icons from Iconify, packaged for Flutter (8080 icons, MIT license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: Iconoir
      fonts:
        - asset: assets/fonts/Iconoir.ttf
    - family: Iconoir_2
      fonts:
        - asset: assets/fonts/Iconoir_2.ttf
