name: iconifyx_solar
description: >-
  Solar icons from Iconify, packaged for Flutter (7410 icons, CC BY 4.0 license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: Solar
      fonts:
        - asset: assets/fonts/Solar.ttf
    - family: Solar_2
      fonts:
        - asset: assets/fonts/Solar_2.ttf
