name: iconifyx_fluent_mdl2
description: >-
  Fluent UI MDL2 icons from Iconify, packaged for Flutter (1735 icons, MIT license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: FluentMdl2
      fonts:
        - asset: assets/fonts/FluentMdl2.ttf
