name: iconifyx_archive_meta
description: >-
  iconifyx category-meta package: re-exports every "Archive / Unmaintained" Iconify pack (30 members). Convenient bundle for apps that want all icons in this category at the cost of shipping every member font.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core
  iconifyx_dashicons:
    path: ../iconifyx_dashicons
  iconifyx_el:
    path: ../iconifyx_el
  iconifyx_entypo:
    path: ../iconifyx_entypo
  iconifyx_et:
    path: ../iconifyx_et
  iconifyx_eva:
    path: ../iconifyx_eva
  iconifyx_fa:
    path: ../iconifyx_fa
  iconifyx_fa6_brands:
    path: ../iconifyx_fa6_brands
  iconifyx_fa6_regular:
    path: ../iconifyx_fa6_regular
  iconifyx_fa6_solid:
    path: ../iconifyx_fa6_solid
  iconifyx_fa_brands:
    path: ../iconifyx_fa_brands
  iconifyx_fa_regular:
    path: ../iconifyx_fa_regular
  iconifyx_fa_solid:
    path: ../iconifyx_fa_solid
  iconifyx_flat_color_icons:
    path: ../iconifyx_flat_color_icons
  iconifyx_fluent_mdl2:
    path: ../iconifyx_fluent_mdl2
