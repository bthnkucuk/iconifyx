name: iconifyx_fluent_emoji
description: >-
  Fluent Emoji icons from Iconify, packaged for Flutter (2767 icons, MIT license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: FluentEmoji
      fonts:
        - asset: assets/fonts/FluentEmoji.ttf
    - family: FluentEmojiSecondary
      fonts:
        - asset: assets/fonts/FluentEmojiSecondary.ttf
