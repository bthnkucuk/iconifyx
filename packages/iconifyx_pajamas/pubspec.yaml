name: iconifyx_pajamas
description: >-
  Gitlab SVGs icons from Iconify, packaged for Flutter (183 icons, MIT license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: Pajamas
      fonts:
        - asset: assets/fonts/Pajamas.ttf
