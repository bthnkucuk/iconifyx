name: iconifyx_lucide_lab
description: >-
  Lucide Lab icons from Iconify, packaged for Flutter (388 icons, ISC license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: LucideLab
      fonts:
        - asset: assets/fonts/LucideLab.ttf
