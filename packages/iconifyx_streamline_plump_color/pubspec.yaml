name: iconifyx_streamline_plump_color
description: >-
  Plump color icons icons from Iconify, packaged for Flutter (998 icons, CC BY 4.0 license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: StreamlinePlumpColor
      fonts:
        - asset: assets/fonts/StreamlinePlumpColor.ttf
    - family: StreamlinePlumpColorSecondary
      fonts:
        - asset: assets/fonts/StreamlinePlumpColorSecondary.ttf
