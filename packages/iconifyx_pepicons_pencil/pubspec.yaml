name: iconifyx_pepicons_pencil
description: >-
  Pepicons Pencil icons from Iconify, packaged for Flutter (1275 icons, CC BY 4.0 license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: PepiconsPencil
      fonts:
        - asset: assets/fonts/PepiconsPencil.ttf
    - family: PepiconsPencilSecondary
      fonts:
        - asset: assets/fonts/PepiconsPencilSecondary.ttf
