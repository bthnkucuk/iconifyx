name: iconifyx_icons8
description: >-
  Icons8 Windows 10 Icons icons from Iconify, packaged for Flutter (234 icons, MIT license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: Icons8
      fonts:
        - asset: assets/fonts/Icons8.ttf
