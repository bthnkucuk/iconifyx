name: iconifyx_emoji_meta
description: >-
  iconifyx category-meta package: re-exports every "Emoji" Iconify pack (11 members). Convenient bundle for apps that want all icons in this category at the cost of shipping every member font.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core
  iconifyx_emojione:
    path: ../iconifyx_emojione
  iconifyx_emojione_monotone:
    path: ../iconifyx_emojione_monotone
  iconifyx_emojione_v1:
    path: ../iconifyx_emojione_v1
  iconifyx_fluent_emoji_flat:
    path: ../iconifyx_fluent_emoji_flat
  iconifyx_fluent_emoji_high_contrast:
    path: ../iconifyx_fluent_emoji_high_contrast
  iconifyx_fxemoji:
    path: ../iconifyx_fxemoji
  iconifyx_noto:
    path: ../iconifyx_noto
  iconifyx_noto_v1:
    path: ../iconifyx_noto_v1
  iconifyx_openmoji:
    path: ../iconifyx_openmoji
  iconifyx_streamline_emojis:
    path: ../iconifyx_streamline_emojis
  iconifyx_twemoji:
    path: ../iconifyx_twemoji
