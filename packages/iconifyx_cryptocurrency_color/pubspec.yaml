name: iconifyx_cryptocurrency_color
description: >-
  Cryptocurrency Color Icons icons from Iconify, packaged for Flutter (483 icons, CC0 1.0 license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: CryptocurrencyColor
      fonts:
        - asset: assets/fonts/CryptocurrencyColor.ttf
