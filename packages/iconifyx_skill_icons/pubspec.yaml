name: iconifyx_skill_icons
description: >-
  Skill Icons icons from Iconify, packaged for Flutter (328 icons, MIT license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: SkillIcons
      fonts:
        - asset: assets/fonts/SkillIcons.ttf
    - family: SkillIconsSecondary
      fonts:
        - asset: assets/fonts/SkillIconsSecondary.ttf
