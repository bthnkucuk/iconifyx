name: iconifyx_ph
description: >-
  Phosphor icons from Iconify, packaged for Flutter (9198 icons, MIT license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: Ph
      fonts:
        - asset: assets/fonts/Ph.ttf
    - family: Ph_2
      fonts:
        - asset: assets/fonts/Ph_2.ttf
    - family: Ph_2Secondary
      fonts:
        - asset: assets/fonts/Ph_2Secondary.ttf
    - family: PhSecondary
      fonts:
        - asset: assets/fonts/PhSecondary.ttf
