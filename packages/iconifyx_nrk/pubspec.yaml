name: iconifyx_nrk
description: >-
  NRK Core Icons icons from Iconify, packaged for Flutter (241 icons, CC BY 4.0 license).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  iconifyx_core:
    path: ../iconifyx_core

flutter:
  uses-material-design: false
  fonts:
    - family: Nrk
      fonts:
        - asset: assets/fonts/Nrk.ttf
    - family: NrkSecondary
      fonts:
        - asset: assets/fonts/NrkSecondary.ttf
